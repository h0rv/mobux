[package]
name = "mobux"
default-run = "mobux"
version = "0.1.0"
edition = "2021"
description = "A touch-first terminal workspace for phones"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "mobux"
path = "src/main.rs"

[[bin]]
name = "snap"
path = "src/bin/snap.rs"

[dependencies]
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny-skia = "0.11"
unicode-width = "0.2"
unicode-segmentation = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.29"
fontdue = "0.9"

# Dev builds keep line numbers and drop the rest of the debug info.
# Incremental compilation is off so sccache can store each crate.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_numeric_casts = "deny"
unused_qualifications = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "deny"
complexity = "deny"
perf = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
