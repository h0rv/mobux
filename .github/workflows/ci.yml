name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep expect shellcheck bison pkg-config libevent-dev libncurses-dev libutempter-dev
      # Ubuntu 24.04's tmux 3.4 has the libutempter SIGCHLD race fixed in 3.6.
      # Test our minimum supported version with libutempter enabled.
      - name: Build minimum supported tmux
        run: |
          work="$RUNNER_TEMP/tmux-source"
          prefix="$RUNNER_TEMP/mobux-tmux"
          mkdir -p "$work"
          cd "$work"
          curl -fL https://github.com/tmux/tmux/releases/download/3.6/tmux-3.6.tar.gz -o tmux.tar.gz
          echo '136db80cfbfba617a103401f52874e7c64927986b65b1b700350b6058ad69607  tmux.tar.gz' | sha256sum -c -
          tar -xzf tmux.tar.gz
          cd tmux-3.6
          ./configure --prefix="$prefix" --enable-utempter
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          cargo build --locked --bin mobux
          expect tests/pty-sessions.exp
          expect tests/pty-install.exp
          expect tests/pty-files.exp
          bash tests/setup-termux-vim.sh
          shellcheck scripts/*.sh tests/setup-termux-vim.sh

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            compiler: aarch64-linux-android28-clang
          - target: x86_64-linux-android
            compiler: x86_64-linux-android28-clang
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          key="CARGO_TARGET_$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$key=$toolchain/${{ matrix.compiler }}" >> "$GITHUB_ENV"
      - name: Build Android binary
        env:
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: cargo build --locked --release --bin mobux --target '${{ matrix.target }}'
      - name: Package binary and notices
        run: bash scripts/package-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mobux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  unix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --bin mobux --target '${{ matrix.target }}'
      - name: Check native startup
        run: |
          if [ "$(rustc -vV | awk '/^host:/ {print $2}')" = '${{ matrix.target }}' ]; then
            './target/${{ matrix.target }}/release/mobux' --version
          fi
      - name: Package
        run: bash scripts/package-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mobux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, android, unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mobux-*
          merge-multiple: true
          path: dist
      - name: Publish experimental snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "snapshot-$RUN_NUMBER" dist/* \
            --target "$COMMIT" --prerelease \
            --title "Experimental snapshot $RUN_NUMBER" \
            --notes "Android 9+, Linux, and macOS binaries for ARM64 and x86_64. Android builds are cross-compiled and not yet verified on a physical phone. Commit: $COMMIT. See SETUP.md before installing."
      # Delete old snapshots only after the replacement was published.
      # Preserve source tags, stable releases, drafts, and any newer snapshot.
      - name: Keep only the newest snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tags=$(gh api --paginate 'repos/{owner}/{repo}/releases?per_page=100' \
            --jq '.[] | select(.draft == false and .prerelease == true) | .tag_name')
          while IFS= read -r tag; do
            if [[ $tag =~ ^snapshot-([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] < RUN_NUMBER )); then
              gh release delete "$tag" --yes
            fi
          done <<< "$tags"
